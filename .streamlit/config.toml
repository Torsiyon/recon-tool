# Kurumsal koyu tema. Arayüzdeki alarm/kart renkleri bu temayla uyumludur.
[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#11151c"
textColor = "#e5e9f0"
font = "sans serif"

[server]
headless = true
fileWatcherType = "none"
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Sağ üstteki "Deploy" butonu, menü ve koşma (running-man/stop) göstergesini gizler.
toolbarMode = "minimal"
